name: CI2
permissions:
  contents: write

on: 
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a release"
        required: false
        default: true
        type: boolean

env:
  CI_CHUNK_SIZE: 65

jobs:
  build_individual:
    name: Build individual modules (Only src/zh/ItsAcg)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      # 【关键改动】删除所有 Prepare signing key 密钥生成步骤
      - name: Build extensions (Only src/zh all sources)
        run: |
          chmod +x ./gradlew | true
          # 打印目录用于校验
          echo "=== src目录列表 ==="
          ls -la ./src
          echo "=== src/zh目录列表 ==="
          ls -la ./src/zh
          # 编译整个src/zh，项目自动使用内置调试签名
          ./gradlew -p src/zh assembleRelease
      - name: Upload zh build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: "individual-apks"
          path: |
            src/zh/**/build/outputs/apk/release/*.apk
            src/zh/**/build/outputs/jar/release/*.jar
            **/keiyoushi-source-info.json
          retention-days: 1

      # 【关键改动】删除密钥清理步骤，不再生成signingkey.jks

  publish_repo:
    name: Publish repo
    if: ${{ inputs.release == true }}
    needs:
      - build_individual
    runs-on: ubuntu-latest
    steps:
      - name: Download APK artifacts
        uses: actions/download-artifact@v8
        with:
          path: ~/apk-artifacts

      - name: Checkout main branch
        uses: actions/checkout@v7
        with:
          ref: main
          path: main
          persist-credentials: false

      - name: Checkout repo branch
        uses: actions/checkout@v7
        with:
          ref: repo
          path: repo
          persist-credentials: true

      # 修复 logs.txt 不存在报错
      - name: Precreate log directory & empty log file
        run: |
          cd repo
          mkdir -p src/zh
          touch src/zh/logs.txt
          ls -la src/zh

      - name: Publish and deploy repo
        env:
          DELETE: '["zh.copymangas"]'
        run: |
          cd repo
          pip install protobuf
          python ../main/.github/scripts/publish-repo.py "$DELETE"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git status
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "Update extensions repo (only src/zh)"
            git push
          else
            echo "No changes to commit"
          fi
