name: CI2

on:
  push:
    branches:
      - main
    paths:
      - '**'
      - '!**.md'
      - '!.github/**'
      - '.github/scripts/**'
      - '.github/workflows/build_push.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

env:
  CI_CHUNK_SIZE: 80
  IS_PR_CHECK: false

jobs:
  prepare:
    name: Prepare job
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.generate-matrices.outputs.matrix }}
      delete: ${{ steps.generate-matrices.outputs.delete }}
    steps:
      - name: Checkout main branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Get last successful CI commit
        uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1 # v5.0.1
        with:
          fallback-sha: 4b825dc642cb6eb9a060e54bf8d69288fbee4904 # empty tree

      - id: generate-matrices
        name: Create output matrices
        run: |
          python ./.github/scripts/generate-build-matrices.py "$NX_BASE" Release

  build:
    name: Build extensions (${{ matrix.chunk.number }})
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ toJson(fromJson(needs.prepare.outputs.matrix).chunk) != '[]' }}
    strategy:
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout main branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: 17
          distribution: temurin

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          cache-read-only: ${{ matrix.chunk.number > 1 }}

      # 核心修复参数：关闭混淆、关闭字节码优化、强制生成stackmap
      - name: Run Gradle Build
        env:
          MODULES: ${{ join(matrix.chunk.modules, ' ') }}
        run: ./gradlew $MODULES --stacktrace -PminifyEnabled=false -PshrinkResources=false -Pandroid.compileJava.options.compilerArgs="-g,-stackmap"

      - name: Collect APK files
        run: |
          mkdir -p ./output_apks
          find . -path "*/build/outputs/apk/release/*.apk" -exec cp {} ./output_apks/ \;

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "fixed-apks-${{ matrix.chunk.number }}"
          path: ./output_apks
          retention-days: 2

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all APK artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./all_apks

      - name: Package all apks into zip
        run: |
          mkdir release_package
          find ./all_apks -name "*.apk" -exec cp {} release_package/ \;
          zip -r all_extensions_fixed.zip release_package

      - name: Create Release & Upload ZIP
        uses: softprops/action-gh-release@v1
        with:
          tag_name: fixed-stackmap-build-$(date +%Y%m%d_%H%M)
          name: Fixed StackMap Build $(date +%Y-%m-%d)
          body: |
            修复：强制保留StackMap帧，兼容Suwayomi JDK17校验
            构建参数：关闭R8混淆/资源压缩、开启完整调试栈信息
            说明：未签名APK，仅用于Suwayomi服务端导入
          files: all_extensions_fixed.zip
          draft: false
          prerelease: true
